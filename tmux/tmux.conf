set -g mouse on

# Set prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

unbind-key '%'
unbind-key '"'

# use vim-like keys for splits and windows
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g default-terminal screen-256color
set -g base-index 1
set -g renumber-windows on

set -g history-limit 16384

set-window-option -g window-status-current-style bg=white
set-window-option -g window-status-current-format " #I:#W "

# Make scrolling smoother (1 line instead of 5)
bind -T copy-mode WheelUpPane select-pane \; send-keys -N 1 -X scroll-up
bind -T copy-mode WheelDownPane select-pane \; send-keys -N 1 -X scroll-down
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -N 1 -X scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -N 1 -X scroll-down
